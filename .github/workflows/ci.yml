name: CI

on:
  push:
    branches: [ main, TimesFM ]
  pull_request:
    branches: [ main, TimesFM ]

jobs:
  test:
    name: Unit & Mocked Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run unit test suite
        run: |
          mkdir -p data_cache/test_tmp
          uv run pytest tests/ -q --basetemp=data_cache/test_tmp
